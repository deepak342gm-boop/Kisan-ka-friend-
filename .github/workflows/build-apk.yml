name: Build Kisan Ka Friend APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Web Folder
        run: |
          set -e

          echo "Checking web files..."

          test -f index.html
          test -f style.css
          test -f script.js

          rm -rf www
          mkdir -p www

          cp index.html www/index.html
          cp style.css www/style.css
          cp script.js www/script.js

          echo "Web files copied successfully:"
          ls -la www

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kisankafriend.app",
            "appName": "Kisan Ka Friend",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Copy Web Files
        run: |
          set -e

          test -f www/index.html
          test -f www/style.css
          test -f www/script.js

          npx cap copy android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisan-Ka-Friend-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
