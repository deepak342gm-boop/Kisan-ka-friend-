name: Build Kisan Ka Friend APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Web Folder
        run: |
          mkdir -p www

          cp index.html www/

          if [ -f style.css ]; then
            cp style.css www/
          fi

          if [ -f script.js ]; then
            cp script.js www/
          fi

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.kisankafriend.app",
            "appName": "Kisan Ka Friend",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare App Icon
        run: |
          ICON=$(find . -maxdepth 1 -type f \( \
            -iname "*.png" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" \
          \) | head -n 1)

          if [ -n "$ICON" ]; then
            echo "Using icon: $ICON"

            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi

            magick "$ICON" \
              -resize "1024x1024^" \
              -gravity center \
              -extent 1024x1024 \
              /tmp/app_icon.png

            magick /tmp/app_icon.png \
              -resize 48x48 \
              android/app/src/main/res/mipmap-mdpi/ic_launcher.png

            magick /tmp/app_icon.png \
              -resize 72x72 \
              android/app/src/main/res/mipmap-hdpi/ic_launcher.png

            magick /tmp/app_icon.png \
              -resize 96x96 \
              android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

            magick /tmp/app_icon.png \
              -resize 144x144 \
              android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

            magick /tmp/app_icon.png \
              -resize 192x192 \
              android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
              android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

            cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
              android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

            cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
              android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

            cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
              android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
              android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          else
            echo "No image found for app icon."
          fi

      - name: Copy Web Files
        run: |
          npx cap copy android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisan-Ka-Friend-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
